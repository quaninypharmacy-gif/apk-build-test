name: apk-build-test
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create minimal Flutter app
        run: flutter create --project-name apk_test --platforms android app
      - name: Install test main.dart
        run: cp main.dart app/lib/main.dart
      - name: Build release APK (split per ABI)
        run: cd app && flutter build apk --release --split-per-abi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-test-arm64
          path: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
